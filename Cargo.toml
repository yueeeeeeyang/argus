# 文件职责：定义 Argus 桌面客户端的 Cargo 包信息与依赖版本。
# 创建日期：2026-06-09
# 修改日期：2026-10-28
# 作者：Argus 开发团队
# 主要功能：配置 Rust 版本、包元信息以及 GPUI 界面依赖。

[package]
name = "argus"
version = "1.4.3"
edition = "2024"
publish = false
description = "Argus 高性能日志查看与分析桌面客户端"

[lints.rust]
unreachable_pub = "warn"

[dependencies]
# Agent 批量搜索使用成熟的多模式自动机一次匹配全部普通关键字，避免逐模式正则扫描。
aho-corasick = "1.1.5"
# 系统凭据库不可用时的本地回落：AES-256-GCM 提供认证加密，避免任何明文密钥材料落盘。
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
bzip2 = "0.6.1"
chardetng = "1.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8.42"
flate2 = "1.1.10"
# 消费 Rig 的多轮流式响应，并把思考和正文增量分批转发到 GPUI。
futures = "0.3.34"
# GPUI 0.2.2 在 macOS 默认会调用完整 Xcode 的 metal 工具预编译 shader。
# 当前开发环境只有 Command Line Tools，因此启用 runtime_shaders 让 cargo check 可在本机完成。
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# 采集操作系统随机盐，配合机器标识派生本地回落密钥；代码中不保存任何密钥常量。
getrandom = "0.4.3"
hex = "0.4.3"
# HKDF 把机器标识与随机盐扩展为固定长度密钥，避免把盐直接当作密钥使用。
hkdf = "0.13.0"
icondata = { version = "0.7.0", default-features = false, features = ["lucide"] }
keyring = "4.2.0"
memmap2 = "0.9.12"
percent-encoding = "2.3.2"
# 使用成熟的 CommonMark/GFM 事件解析器驱动 AI 消息 Markdown 展示，关闭未使用的 HTML 输出功能。
pulldown-cmark = { version = "0.13.5", default-features = false }
rars = { version = "0.12.3", default-features = false, features = ["encryption"] }
regex = "1.13.1"
# Rig 使用 reqwest 发送 OpenAI 兼容请求；直接依赖用于设置每次模型请求的超时。
reqwest = "0.13.5"
rig-core = "=0.40.0"
roxmltree = "0.21.2"
schemars = "1.2.3"
# SQL 归一化复用完整词法器，区分引号标识符、字面量及运算符。
sqlparser = { version = "0.63.0", default-features = false, features = ["std"] }
# SVN SSH 主机指纹预检直接复用与 svn crate 相同的纯 Rust russh 栈，不启动系统 ssh。
russh = { version = "0.65.0", default-features = false, features = ["ring", "rsa"] }
# SVN HTTPS 保持默认严格校验，并支持按连接确认指定证书的例外。
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
sevenz-rust = "0.6.1"
similar = "3.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
secrecy = "0.10.3"
sha2 = "0.11.1"
# 0.13 使用稳定版 aes 0.9，与 svn 的 russh 加密栈兼容；API 保持现有 SMB 行为不变。
smb2 = "0.13.0"
# SVN 的 svn/svn+ssh 传输使用纯 Rust ra_svn，HTTP(S) 只读传输使用内置 DAV 客户端；
# ssh 特性通过 russh 建立隧道，不调用本机 svn/ssh，也不启用系统 libsasl2。
svn = { version = "0.1.16", features = ["ssh"] }
tar = "0.4.46"
thiserror = "2.0.21"
toml = "0.9.8"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "fs", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tempfile = "3.27.0"
# SVN HTTPS 使用操作系统信任根，兼容由企业 CA 签发且已安装到系统证书库的内网仓库。
ureq = { version = "2.12.1", features = ["native-certs"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
vt100 = "0.18.1"
walkdir = "2.5.0"
x509-parser = { version = "0.18.1", features = ["verify"] }
xz2 = "0.1.7"
zip = { version = "9.1.2", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate", "lzma", "ppmd", "time", "zstd", "xz"] }

[target.'cfg(windows)'.dependencies]
# Windows 由 libgit2 使用平台原生 TLS/加密能力，避免引入额外 OpenSSL 动态库。
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-libgit2"] }
# libssh2 在 Windows 默认使用系统 WinCNG。避免启用 vendored-openssl，才能从非 Windows
# 主机交叉编译 MSVC 目标，同时无需随应用分发额外的 OpenSSL 动态库。
ssh2 = "0.9.5"
raw-window-handle = "0.6.2"
windows-sys = { version = "0.60.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# 取消工具执行时终止独立进程组，覆盖 shell 创建的全部后代。
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
# macOS/Linux 静态构建 libgit2 与 OpenSSL，确保安装包不依赖目标机预装开发库。
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
# macOS/Linux 延续原有的 vendored OpenSSL 策略，避免依赖开发机预装的 OpenSSL 版本。
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 主窗口使用透明原生标题栏，需要按视图区分可拖拽空白与标签等交互元素。
# NSWorkspace 用于查询 LaunchServices 的“用 Argus 打开”注册状态。
block = "0.1.6"
objc = "0.2.7"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSArray", "NSString", "NSURL"] }
raw-window-handle = "0.6.2"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
# TLS 回归测试运行时生成证书，仓库不保存私钥或环境证书。
rcgen = "0.14.10"
# 验证编译期字体字节的名称与等宽度量，避免依赖 GPUI 测试平台的空字体系统。
ttf-parser = "0.25.1"
# 标题栏和模态框等 GPUI 交互需要真实 hitbox/input 回归测试，测试构建开启官方测试上下文。
gpui = { version = "0.2.2", features = ["runtime_shaders", "test-support"] }
wiremock = "0.6.5"

[patch.crates-io]
# GPUI 0.2.2 的 Windows release shader 构建仅能在 Windows 主机运行；本地补丁复用
# runtime_shaders 特性，将内嵌 HLSL 交给 Windows D3DCompiler，支持 macOS/Linux 交叉编译。
# 文本测量补丁按换行和截断宽度复用缓存，并在重排时恢复原始样式，避免标题只剩省略号。
gpui = { path = "third_party/gpui" }
# block 0.1.6 已停止维护，其空枚举占位类型触发的 uninhabited static 将在未来 Rust 版本成为硬错误；
# 本地补丁保持 0.1.6 API 不变，仅将占位类型改为零大小结构体。
block = { path = "third_party/block" }
